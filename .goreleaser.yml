version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: hakscan
    main: ./cmd/hakscan
    binary: hakscan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: default
    name_template: "hakscan_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: slayzbsss
    name: Hakscan
